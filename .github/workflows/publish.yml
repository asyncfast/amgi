name: Publish
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Build
        run: uv build --all-packages
      - name: Publish
        run: uv publish
